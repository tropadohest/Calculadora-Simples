<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
    <div id="Container">
    <div id="ResultContainer"></div>
    <div id="SecondResultContainer"></div>
      <div id="FirstLayer">
    <div id="BtnOne" class="Destaque">1</div>
    <div id="BtnTwo" class="Destaque">2</div>
    <div id="BtnThree" class="Destaque">3</div>
    <div id="BtnMinus" class="Destaque">-</div>
      </div>
      <div id="SecondLayer">
    <div id="BtnFour" class="Destaque">4</div>
    <div id="BtnFive" class="Destaque">5</div>
    <div id="BtnSix" class="Destaque">6</div>
    <div id="BtnMult" class="Destaque">*</div>
      </div>
      <div id="ThirdLayer">
    <div id="BtnSeven" class="Destaque">7</div>
    <div id="BtnEight" class="Destaque">8</div>
    <div id="BtnNine" class="Destaque">9</div>
    <div id="BtnDiv" class="Destaque">/</div>
      </div>
      <div id="FourthLayer">
    <div id="BtnZero" class="Destaque">0</div>
    <div id="BtnClear" class="Destaque">C</div>
    <div id="BtnEqual" class="Destaque">=</div>
    <div id="BtnMore" class="Destaque">+</div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
